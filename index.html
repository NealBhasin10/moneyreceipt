function Showdown({ def, saved, remove }) {
  const rows = [{ id: "base", name: "Baseline (as written)", inputs: def.defaults }, ...saved].map((r) => ({ ...r, m: def.metrics(def.calc(r.inputs)) }));
  const base = rows[0].m;
  const first = rows.map((r) => ({ label: r.name, amount: r.m[0][1] }));
  return (
    <div className="card card-pad" style={{ marginTop: 18 }}>
      <div className="card-head">
        <div><h2>Scenario showdown</h2><p className="card-sub">Your saved scenarios against the document as written. Differences are shown against the baseline.</p></div>
        <span className="tag">Estimate</span>
      </div>
      {saved.length === 0 ? (
        <div className="alert t-blue"><Icon name="save" size={16} /><div><strong>No saved scenarios yet.</strong> Set the sliders above, then choose <b>Save scenario</b>. You can compare up to 3 against the baseline.</div></div>
      ) : (
        <>
          <div className="cmp-table-wrap">
            <table className="cmp-table sd-table">
              <thead><tr><th scope="col">Scenario</th>{base.map(([label]) => <th scope="col" key={label}>{label}</th>)}<th scope="col"><span className="sr-only">Actions</span></th></tr></thead>
              <tbody>
                {rows.map((r, ri) => (
                  <tr key={r.id}>
                    <th scope="row" style={{ color: "var(--fg)" }}>{r.name}{ri === 0 && <div className="card-sub" style={{ fontWeight: 400 }}>Default inputs</div>}</th>
                    {r.m.map(([label, v, kind, better], mi) => {
                      const b = base[mi][1], d = v - b;
                      const good = better === "low" ? d < 0 : d > 0;
                      const tone = Math.abs(d) < 0.005 ? "gray" : good ? "green" : "red";
                      return (
                        <td key={label} className="num-cell">
                          {fmtMetric(v, kind)}
                          {ri > 0 && <span className={`diff t-${tone}`}>{Math.abs(d) < 0.005 ? "No change" : `${d > 0 ? "+" : "−"}${fmtMetric(Math.abs(d), kind)}${b ? ` (${d > 0 ? "+" : "−"}${Math.abs((d / b) * 100).toFixed(0)}%)` : ""}`}</span>}
                        </td>
                      );
                    })}
                    <td>{ri > 0 && <button className="btn btn-danger-ghost btn-sm" onClick={() => remove(r.id)} aria-label={`Remove scenario ${r.name}`}><Icon name="trash" size={15} /></button>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <Bars title={base[0][0]} rows={first.map((f, i) => ({ ...f, tone: i === 0 ? "blue" : "yellow" }))} />
        </>
      )}
    </div>
  );

          <p className="card-sub" style={{ marginTop: 6 }} aria-live="polite">{running ? "Running checks…" : `Last run ${new Date(ranAt).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", second: "2-digit" })} · ${groups.length} areas: ${groups.join(", ")}`}</p>

        <button className="btn btn-primary" onClick={rerun} disabled={running}><Icon name="flask" size={16} /> {running ? "Running…" : "Run checks again"}</button>
      </div>
      <div className="filters" role="group" aria-label="Filter checks" style={{ marginTop: 16 }}>
        {[["all", `All (${results.length})`], ["pass", `Passed (${passed})`], ["fail", `Failed (${results.length - passed})`]].map(([k, l]) => <button key={k} className="fchip t-gray" aria-pressed={filter === k} onClick={() => setFilter(k)}>{l}</button>)}
      </div>
      {groups.map((g) => {
        const list = shown.filter((r) => r.group === g);
        if (!list.length) return null;
        return (
          <div className="group" key={g}>
            <h3>{g}</h3>
            <div className="lab-list">
              {list.map((r) => (
                <details className={`card lab-item t-${r.pass ? "green" : "red"}`} key={r.name}>
                  <summary>
                    <span className="lab-ico"><Icon name={r.pass ? "check" : "x"} size={15} stroke={2.6} /></span>
                    <span style={{ minWidth: 0 }}><h3>{r.name}</h3><p>{r.why}</p></span>
                    <Pill tone={r.pass ? "green" : "red"}>{r.pass ? "Passed" : "Failed"}</Pill>
                  </summary>
                  <div className="lab-detail"><div><b>Expected</b>{r.expected}</div><div><b>Actual</b>{r.actual}</div></div>
                </details>
              ))}
            </div>
          </div>
        );
      })}
      {!shown.length && <p className="card-sub">No checks in this filter.</p>}
      <div className="report-disclaimer"><p className="disclaimer"><Icon name="info" size={15} /><span>These checks test the prototype's logic on its built-in demo documents and synthetic cases. They don't verify the contents of uploaded files, which this prototype doesn't read.</span></p></div>
    </div>
  );
}

function NotesCard({ doc, updateDoc }) {
  const [val, setVal] = useState(doc.notes || "");
  const [saved, setSaved] = useState(false);
  useEffect(() => {
    if (val === (doc.notes || "")) return;
    const t = setTimeout(() => { updateDoc(doc.id, { notes: val }); setSaved(true); }, 500);
    return () => clearTimeout(t);
  }, [val]);
  return (
    <div className="card card-pad notes">
      <div className="card-head"><h2><label htmlFor={`notes-${doc.id}`}>My notes</label></h2>{saved && <span className="card-sub" role="status">Saved</span>}</div>
      <textarea id={`notes-${doc.id}`} value={val} placeholder="Jot down answers you got, who you spoke to, or reminders…" onChange={(e) => { setVal(e.target.value); setSaved(false); }} />
      <p className="card-sub" style={{ fontSize: 12.5, marginTop: 6 }}>Saved in this browser with this document.</p>
    </div>
  );
}

/* ---------------------------------------------------------------- Compare */
function CompareView({ docs, ids, open, go, swap }) {
  const pair = ids.map((id) => docs.find((d) => d.id === id)).filter(Boolean);
  if (pair.length < 2) return <EmptyState icon="scale" title="Pick two documents to compare" actions={<button className="btn btn-primary" onClick={() => go("history")}>Go to History</button>}>Select two saved documents in History, then choose Compare.</EmptyState>;
  const ds = pair.map((d) => ({ doc: d, data: SAMPLES[d.sampleKey] }));
  const highs = ds.map((x) => x.data.risks.filter((r) => r.sev === "high").length);
  const fieldCell = (x, k) => { const f = x.data.fields[k]; return f ? <span className={`t-${f.tone}`}><span className="dot" style={{ marginRight: 6 }}></span>{f.v}</span> : <span className="missing">{NOT_FOUND}</span>; };
  const rows = [
    ["Document type", (x) => TYPE_BY_KEY[x.doc.type].label],
    ["Risk level", (x) => <Pill tone={RISK_LEVEL[x.data.risk].tone}>{RISK_LEVEL[x.data.risk].label}</Pill>],
    ["Headline figure", (x) => <><b className="num">{x.data.cards.a.value}</b><div className="card-sub">{x.data.cards.a.label}</div></>],
    ["Second figure", (x) => <><b className="num">{x.data.cards.b.value}</b><div className="card-sub">{x.data.cards.b.label}</div></>],
    ["Next deadline", (x) => { const nd = nextDeadline(x.data); return nd ? <>{fmtDate(nd.date)}<div className="card-sub">{nd.label}</div></> : "None upcoming"; }],
    ["High-severity risks", (x, i) => <><b>{highs[i]}</b>{highs[i] < highs[1 - i] && <span className="better"><Pill tone="green" icon="check">Fewer</Pill></span>}</>],
    ["Main risk", (x) => x.data.cards.risk],
    ["Hidden fees", (x) => fieldCell(x, "hiddenFees")],
    ["Cancellation penalty", (x) => fieldCell(x, "cancellationPenalty")],
    ["Late fees", (x) => fieldCell(x, "lateFees")],
    ["Questions to ask", (x) => `${x.data.questions.length} questions`],
  ];
  return (
    <div className="fade-in">
      <button className="link-btn back" onClick={() => go("history")}><Icon name="arrowLeft" size={15} /> All documents</button>
      <div className="page-head"><div><h1>Compare documents</h1><p>Side-by-side view of the terms that matter most, plus what changed between versions.</p></div>
        <button className="btn btn-ghost btn-sm" onClick={swap}><Icon name="diff" size={15} /> Swap before / after</button></div>
      <div className="card cmp-table-wrap">
        <table className="cmp-table">
          <thead><tr><th scope="col"><span className="sr-only">Term</span></th>{ds.map((x) => <th scope="col" key={x.doc.id}><button className="hist-name" onClick={() => open(x.doc.id)}>{x.doc.name}</button>{x.doc.prototype && <div><span className="tag tag-ex">Example data</span></div>}</th>)}</tr></thead>
          <tbody>{rows.map(([label, fn]) => <tr key={label}><th scope="row">{label}</th>{ds.map((x, i) => <td key={x.doc.id}>{fn(x, i)}</td>)}</tr>)}</tbody>
        </table>
      </div>
      <ChangeDetector A={ds[0]} B={ds[1]} />
      <div className="report-disclaimer"><Disclaimer /></div>
    </div>
  );
}

/* ---------------------------------------------------------------- Glossary */

    <div className="fade-in">
      <div className="page-head">

      <div className="toolbar">
        <div className="search">
          <Icon name="search" size={17} />
          <label htmlFor="gloss-search" className="sr-only">Search terms</label>
          <input id="gloss-search" className="input" type="search" placeholder="Search, e.g. APR or deductible" value={q} onChange={(e) => setQ(e.target.value)} />

      {list.length ? (
        <div className="gloss-grid" aria-live="polite">

/* ---------------------------------------------------------------- Report */
const TABS = [
  { key: "overview", label: "Overview", icon: "grid" },
  { key: "brief", label: "Decision brief", icon: "shield" },
  { key: "scenarios", label: "What if", icon: "sliders" },
  { key: "breakdown", label: "Full breakdown", icon: "receipt" },
  { key: "deadlines", label: "Deadlines", icon: "calendar" },
  { key: "risks", label: "Risks", icon: "alert" },
  { key: "questions", label: "Questions", icon: "question" },
  { key: "document", label: "Document", icon: "file" },
  { key: "summary", label: "Summary sheet", icon: "download" },
];

function Report({ doc, go, requestDelete, updateDoc, notify }) {
  const data = SAMPLES[doc.sampleKey];
  const [tab, setTab] = useState("overview");
  const [highlight, setHighlight] = useState(null);
  const tabRefs = useRef({});
  const panelRef = useRef(null);
  const nd = nextDeadline(data);
  const rl = RISK_LEVEL[data.risk];

  const blocks = useMemo(() => Object.fromEntries(data.pages.flatMap((p) => p.blocks).map((b) => [b.id, b])), [data]);
  const viewSource = useCallback((a) => {
    setTab("document");
    setHighlight({ a, t: Date.now() });
  }, []);
  const changeTab = (k) => { setTab(k); setHighlight(null); };
  const onTabKey = (e, i) => {
    let n = null;
    if (e.key === "ArrowRight") n = (i + 1) % TABS.length;
    if (e.key === "ArrowLeft") n = (i - 1 + TABS.length) % TABS.length;
    if (e.key === "Home") n = 0;
    if (e.key === "End") n = TABS.length - 1;
    if (n != null) { e.preventDefault(); changeTab(TABS[n].key); tabRefs.current[TABS[n].key]?.focus(); }
  };
  const goTab = (k) => { changeTab(k); setTimeout(() => panelRef.current?.scrollIntoView({ behavior: "smooth", block: "start" }), 0); };

  const download = async (fmt) => {
    const base = `moneyreceipt-${slug(doc.name)}`;
    try {
      await offerFile(fmt === "html" ? `${base}.html` : `${base}.txt`, fmt === "html" ? buildSummaryHTML(doc, data) : buildSummaryText(doc, data));
      notify("Summary downloaded");
    } catch (e) {
      if (e && e.code === "declined") notify("Download cancelled");
      else if (e && e.code === "rate_limited") notify("A download prompt is already open");
      else notify("Downloads aren't available here. Use Copy summary instead.");
    }
  };
  const copy = async () => {
    const ok = await copyText(buildSummaryText(doc, data));
    notify(ok ? "Summary copied to clipboard" : "Couldn't copy. Open the Summary sheet tab and select the text.");
  };
  const qs = doc.qs || Object.fromEntries((doc.asked || []).map((i) => [i, "asked"]));
  const setStatus = (i, v) => updateDoc(doc.id, { qs: { ...qs, [i]: v } });
  const sectionCount = data.pages.reduce((n, p) => n + p.blocks.length, 0);

  return (
    <ReportCtx.Provider value={{ viewSource, blocks, notify }}>
      <div className="fade-in">
        <button className="link-btn back" onClick={() => go("history")}><Icon name="arrowLeft" size={15} /> All documents</button>
        <div className="report-hero">
        <div className="report-head">
          <div style={{ minWidth: 0, flex: "1 1 420px" }}>
            <p className="eyebrow">Financial summary</p>
            <h1 style={{ marginTop: 4 }}>{doc.name}</h1>
            <div className="meta">
              <Pill tone={rl.tone} icon={data.risk === "low" ? "check" : "alert"} large>{rl.label}</Pill>
              <span className="chip"><Icon name={TYPE_BY_KEY[doc.type].icon} size={14} /> {TYPE_BY_KEY[doc.type].label}</span>
              <span className="chip"><Icon name="clock" size={14} /> Analyzed {fmtDateTime(doc.analyzedAt)}</span>
              <span className="chip"><Icon name="file" size={14} /> {doc.fileName}</span>
              {doc.demo && <span className="tag">Demo document</span>}
              {doc.prototype && <span className="tag tag-ex">Example data</span>}
            </div>
            <p className="coverage" style={{ marginTop: 8 }}><Icon name={doc.prototype ? "alert" : "check"} size={14} />
              {doc.prototype ? "Your file was not read. Results below come from an example document." : `Coverage: all ${data.pages.length} pages and ${sectionCount} sections of the document were reviewed.`}</p>
            <RiskWhy data={data} />
          </div>
          <div className="head-side">
          <RiskGauge level={data.risk} />
          <div className="actions">
            <button className="btn btn-ghost btn-sm" onClick={() => download("html")}><Icon name="download" size={16} /> Download</button>
            <button className="btn btn-ghost btn-sm" onClick={copy}><Icon name="copy" size={16} /> Copy</button>
            <button className="btn btn-danger-ghost btn-sm" onClick={() => requestDelete(doc)}><Icon name="trash" size={16} /> Delete</button>
          </div>
          </div>
        </div>
        </div>

        {doc.prototype && (
          <div className="alert t-yellow banner proto-banner" role="note">
            <Icon name="alert" size={18} />
            <div><strong>EXAMPLE DATA, NOT FROM YOUR FILE.</strong> MoneyReceipt didn't read the contents of <b>{doc.fileName}</b>. You're seeing a worked example for {article(TYPE_BY_KEY[doc.type].label)} {TYPE_BY_KEY[doc.type].label.toLowerCase()} so you can explore the report. A full version would extract these values from your file.</div>
          </div>
        )}

        <div className="card plain-summary">
          <span className="ico"><Icon name="receipt" size={18} /></span>
          <div><p className="eyebrow" style={{ marginBottom: 4 }}>In plain language</p><p>{data.summary}</p></div>
        </div>

        <section className="card next-steps" aria-labelledby="next-h">
          <div className="card-head" style={{ marginBottom: 0 }}><h2 id="next-h" style={{ fontSize: 17 }}>What to do next</h2><button className="link-btn" onClick={() => goTab("brief")}>Open decision brief <Icon name="arrowRight" size={14} /></button></div>
          <ol>{data.nextSteps.map((n) => <li key={n}><span>{n}</span></li>)}</ol>
        </section>

        <div className="kpis">
          <KpiCard {...data.cards.a} icon="receipt" example={doc.prototype} />
          <KpiCard {...data.cards.b} icon="calendar" example={doc.prototype} />
          <KpiCard label="Next deadline" icon="clock" tone={nd ? nd.tone : "gray"} small
            value={nd ? fmtDate(nd.date) : "None upcoming"} sub={nd ? `${relDays(nd.date)} · ${nd.label}` : "All dates in this document have passed."} src={nd?.src} tag={nd?.calc ? "Calculated" : null} deadline={!!nd} />
          <KpiCard label="Main risk" icon="alert" tone="red" small value={data.cards.risk} sub={<button className="link-btn" onClick={() => goTab("risks")}>See all {data.risks.length} risks</button>} />
        </div>

        <div className="tabs no-print" role="tablist" aria-label="Report sections">
          {TABS.map((t, i) => (
            <button key={t.key} ref={(el) => (tabRefs.current[t.key] = el)} role="tab" id={`tab-${t.key}`} aria-controls={`panel-${t.key}`}
              aria-selected={tab === t.key} tabIndex={tab === t.key ? 0 : -1} className="tab" onClick={() => changeTab(t.key)} onKeyDown={(e) => onTabKey(e, i)}>
              <Icon name={t.icon} size={15} />{t.label}
              {t.key === "risks" && <span className="count">{data.risks.length}</span>}
              {t.key === "questions" && <span className="count">{data.questions.length}</span>}
              {t.key === "deadlines" && <span className="count">{data.deadlines.length}</span>}
            </button>
          ))}
        </div>
        <div className="tabpanel" role="tabpanel" id={`panel-${tab}`} aria-labelledby={`tab-${tab}`} ref={panelRef} tabIndex={-1} style={{ scrollMarginTop: 80 }}>
          {tab === "overview" && <OverviewTab data={data} setTab={goTab} doc={doc} updateDoc={updateDoc} />}
          {tab === "brief" && <DecisionBriefTab doc={doc} data={data} updateDoc={updateDoc} setTab={goTab} notify={notify} />}
          {tab === "scenarios" && <ScenariosTab data={data} doc={doc} updateDoc={updateDoc} notify={notify} />}
          {tab === "breakdown" && <BreakdownTab data={data} />}
          {tab === "deadlines" && <DeadlinesTab data={data} />}
          {tab === "risks" && <RisksTab data={data} />}
          {tab === "questions" && <QuestionsTab data={data} qs={qs} setStatus={setStatus} notify={notify} />}
          {tab === "document" && <DocumentTab doc={doc} data={data} highlight={highlight} />}
          {tab === "summary" && <SummaryTab doc={doc} data={data} onDownload={download} onCopy={copy} />}
        </div>

        <div className="report-disclaimer"><Disclaimer /></div>
      </div>
    </ReportCtx.Provider>
  );
}

/* ---------------------------------------------------------------- History */
function HistoryHub({ docs, open, onVersionDemo }) {
  const upcoming = docs.flatMap((d) => SAMPLES[d.sampleKey].deadlines.filter((x) => daysUntil(x.date) >= 0).map((x) => ({ ...x, doc: d })))
    .sort((a, b) => a.date.localeCompare(b.date));
  const soon = upcoming.filter((x) => daysUntil(x.date) <= 30).length;
  const high = docs.filter((d) => SAMPLES[d.sampleKey].risk === "high").length;
  return (
    <div className="hub">
      <div className="stack">
        <div className="stat-tiles">
          <div className="card stat t-blue"><b>{docs.length}</b><span>Documents</span></div>
          <div className="card stat t-red"><b>{high}</b><span>High risk</span></div>
          <div className="card stat t-yellow"><b>{soon}</b><span>Dates in the next 30 days</span></div>
        </div>
        <div className="card card-pad" style={{ display: "flex", gap: 12, alignItems: "center" }}>
          <span className="kpi-ico t-green" style={{ width: 38, height: 38 }}><Icon name="scale" size={18} /></span>
          <div style={{ minWidth: 0 }}>
            <p className="card-sub" style={{ margin: 0 }}>Tick <b>Compare</b> on any two documents below to see them side by side and spot what changed.</p>
            {onVersionDemo && <button className="link-btn" style={{ fontSize: 13.5, marginTop: 4 }} onClick={onVersionDemo}>Try the change detector on a revised lease <Icon name="arrowRight" size={13} /></button>}
          </div>
        </div>
      </div>
      <div className="card card-pad">
        <div className="card-head" style={{ marginBottom: 8 }}><h2>Coming up across your documents</h2></div>
        {upcoming.length ? (
          <ul className="upcoming-list">
            {upcoming.slice(0, 5).map((x) => {
              const dt = parseDate(x.date);
              return (
                <li key={x.doc.id + x.date + x.label}>
                  <button onClick={() => open(x.doc.id)}>
                    <span className={`u-date t-${x.tone}`}><small>{dt.toLocaleDateString("en-US", { month: "short" })}</small><b>{dt.getDate()}</b></span>
                    <span className="u-main"><b>{x.label}</b><span>{x.doc.name}</span></span>
                    <span className="chip" style={{ fontSize: 12 }}>{relDays(x.date)}</span>
                  </button>
                </li>
              );
            })}
          </ul>
        ) : <p className="card-sub">No upcoming dates in your saved documents.</p>}
      </div>
    </div>
  );
}

function HistoryView({ docs, open, go, startDemo, requestDelete, requestDeleteAll, storageOk, onCompare, onVersionDemo }) {
  const [sel, setSel] = useState([]);
  const toggleSel = (id) => setSel((s0) => s0.includes(id) ? s0.filter((x) => x !== id) : s0.length >= 2 ? [s0[1], id] : [...s0, id]);
  const [q, setQ] = useState("");
  const [type, setType] = useState("all");
  const [risk, setRisk] = useState("all");
  const [sort, setSort] = useState("newest");
  const list = useMemo(() => {
    let l = docs.filter((d) => {
      const data = SAMPLES[d.sampleKey];
      if (type !== "all" && d.type !== type) return false;
      if (risk !== "all" && data.risk !== risk) return false;
      if (q && !(`${d.name} ${d.fileName} ${TYPE_BY_KEY[d.type].label}`.toLowerCase().includes(q.toLowerCase()))) return false;
      return true;
    });
    l = [...l].sort((a, b) => sort === "newest" ? b.analyzedAt - a.analyzedAt : sort === "oldest" ? a.analyzedAt - b.analyzedAt : a.name.localeCompare(b.name));
    return l;
  }, [docs, q, type, risk, sort]);
  const filtered = q || type !== "all" || risk !== "all";
  const clear = () => { setQ(""); setType("all"); setRisk("all"); };

  return (
    <div className="fade-in">
      <div className="page-head">
        <div><h1>Document history</h1><p>{docs.length ? `${docs.length} saved ${docs.length === 1 ? "analysis" : "analyses"}, stored in this browser only.` : "Analyses you run are saved here."} Anyone using this browser can see them, and clearing site data removes them.</p></div>
        <div className="row">
          {docs.length > 0 && <button className="btn btn-danger-ghost btn-sm" onClick={requestDeleteAll}><Icon name="trash" size={16} /> Delete all</button>}
          <button className="btn btn-primary" onClick={() => go("upload")}><Icon name="upload" size={16} /> New analysis</button>
        </div>
      </div>
      {!storageOk && <div className="alert t-yellow" role="note" style={{ marginBottom: 16 }}><Icon name="info" size={18} /><div><strong>History can't be saved in this browser.</strong> Your analyses will be kept until you close or reload this page.</div></div>}

      {docs.length === 0 ? (
        <EmptyState icon="history" title="No documents yet" actions={<>
          <button className="btn btn-primary" onClick={() => go("upload")}><Icon name="upload" size={16} /> Upload a document</button>
          <button className="btn btn-ghost" onClick={() => startDemo("lease")}><Icon name="sparkle" size={16} /> Try the demo lease</button>
        </>}>Upload a bill, lease, loan or other document, or try the demo. Each analysis is saved here so you can come back to it.</EmptyState>
      ) : (
        <>
          <HistoryHub docs={docs} open={open} onVersionDemo={onVersionDemo} />
          <div className="toolbar">
            <div className="search">
              <Icon name="search" size={17} />
              <label htmlFor="hist-search" className="sr-only">Search documents</label>
              <input id="hist-search" className="input" type="search" placeholder="Search by name or file" value={q} onChange={(e) => setQ(e.target.value)} />
            </div>
            <label htmlFor="hist-type" className="sr-only">Document type</label>
            <select id="hist-type" className="select" value={type} onChange={(e) => setType(e.target.value)}>
              <option value="all">All types</option>
              {DOC_TYPES.map((t) => <option key={t.key} value={t.key}>{t.label}</option>)}
            </select>
            <div className="seg" role="group" aria-label="Filter by risk level">
              {[["all", "Any risk"], ["high", "High"], ["medium", "Moderate"], ["low", "Low"]].map(([k, l]) => <button key={k} aria-pressed={risk === k} onClick={() => setRisk(k)}>{l}</button>)}
            </div>
            <label htmlFor="hist-sort" className="sr-only">Sort</label>
            <select id="hist-sort" className="select" value={sort} onChange={(e) => setSort(e.target.value)}>
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="name">Name A–Z</option>
            </select>
          </div>
          {list.length === 0 ? (
            <EmptyState icon="search" title="No documents match" actions={<button className="btn btn-ghost" onClick={clear}>Clear filters</button>}>Try a different search, or clear the filters to see all {docs.length} documents.</EmptyState>
          ) : (
            <div className="hist-list" aria-live="polite">
              {filtered && <p className="card-sub">Showing {list.length} of {docs.length}</p>}
              {list.map((d) => {
                const data = SAMPLES[d.sampleKey];
                const nd = nextDeadline(data);
                const rl = RISK_LEVEL[data.risk];
                return (
                  <div className="card hist" key={d.id}>
                    <span className="file-ico"><Icon name={TYPE_BY_KEY[d.type].icon} size={20} /></span>
                    <div className="hist-main">
                      <button className="hist-name" onClick={() => open(d.id)}>{d.name}</button>
                      <div className="hist-sub">
                        <Pill tone={rl.tone}>{rl.label}</Pill>
                        <span>{TYPE_BY_KEY[d.type].label}</span>
                        <span>{fmtDateTime(d.analyzedAt)}</span>
                        <span>{data.cards.a.label.split(" (")[0]}: <b className="num" style={{ color: "var(--fg)" }}>{data.cards.a.value}</b></span>
                        {nd && <span>Next: {fmtDate(nd.date, { month: "short", day: "numeric" })}, {nd.label.toLowerCase()}</span>}
                        {d.demo && <span className="tag">Demo</span>}
                        {d.prototype && <span className="tag tag-ex">Example data</span>}
                      </div>
                    </div>
                    <div className="hist-actions">
                      <label className="cmp-check"><input type="checkbox" checked={sel.includes(d.id)} onChange={() => toggleSel(d.id)} aria-label={`Compare ${d.name}`} /> Compare</label>
                      <button className="btn btn-ghost btn-sm" onClick={() => open(d.id)}>Open</button>
                      <button className="btn btn-danger-ghost btn-sm" onClick={() => requestDelete(d)} aria-label={`Delete ${d.name}`}><Icon name="trash" size={16} /></button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          {sel.length > 0 && (
            <div className="compare-bar" role="region" aria-label="Compare selection">
              <span style={{ fontWeight: 600 }}>{sel.length === 1 ? "Select one more document to compare" : "2 documents selected"}</span>
              <div className="row">
                <button className="btn btn-ghost btn-sm" onClick={() => setSel([])}>Clear</button>
                <button className="btn btn-primary btn-sm" disabled={sel.length < 2} onClick={() => onCompare(sel)}><Icon name="scale" size={16} /> Compare</button>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------- App */
function App() {
  const initial = useMemo(loadDocs, []);
  const [docs, setDocs] = useState(initial.docs);
  const [storageOk, setStorageOk] = useState(initial.ok);
  const [route, setRoute] = useState({ view: "home" });
  const [pending, setPending] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [toast, setToast] = useState(null);
  const mainRef = useRef(null);
  const toastTimer = useRef(null);
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem("moneyreceipt.theme") || "system"; } catch (e) { return "system"; } });
  const [sysDark, setSysDark] = useState(() => window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  useEffect(() => {
    const el = document.documentElement;
    if (theme === "system") el.removeAttribute("data-theme"); else el.setAttribute("data-theme", theme);
    try { localStorage.setItem("moneyreceipt.theme", theme); } catch (e) {}
  }, [theme]);
  useEffect(() => {
    if (!window.matchMedia) return;
    const mq = matchMedia("(prefers-color-scheme: dark)");
    const fn = (e) => setSysDark(e.matches);
    mq.addEventListener ? mq.addEventListener("change", fn) : mq.addListener(fn);
    return () => (mq.removeEventListener ? mq.removeEventListener("change", fn) : mq.removeListener(fn));
  }, []);
  const isDark = theme === "dark" || (theme === "system" && sysDark);

  useEffect(() => { if (!saveDocs(docs)) setStorageOk(false); }, [docs]);
  useEffect(() => {
    window.scrollTo({ top: 0 });
    mainRef.current && mainRef.current.focus({ preventScroll: true });
  }, [route.view, route.id, (route.ids || []).join()]);

  const notify = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3200);
  };
  const go = (view) => setRoute({ view });
  const open = (id) => setRoute({ view: "report", id });
  const startDemo = (key) => {
    const s = SAMPLES[key];
    setPending({ demo: true, sampleKey: key, type: s.type, fileName: s.fileName, fileSize: s.fileSize, fileKind: s.fileName.split(".").pop().toUpperCase() });
    setRoute({ view: "analyzing" });
  };
  const analyzeUpload = (p) => {
    setPending({ ...p, sampleKey: p.type, prototype: true });
    setRoute({ view: "analyzing" });
  };
  const finish = () => {
    const p = pending;
    const s = SAMPLES[p.sampleKey];
    const doc = {
      id: uid(), sampleKey: p.sampleKey, type: p.type, analyzedAt: Date.now(),
      name: p.demo ? s.name : p.fileName.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " "),
      fileName: p.fileName, fileSize: p.fileSize, fileKind: p.fileKind, demo: !!p.demo, prototype: !!p.prototype,
      preview: p.preview && p.preview.length < 1500000 ? p.preview : null, asked: [],
    };
    setDocs((d) => [doc, ...d]);
    setPending(null);
    setRoute({ view: "report", id: doc.id });
    notify("Analysis saved to History");
  };
  const openVersionDemo = () => {
    const mk = (k) => ({ id: uid(), sampleKey: k, type: "lease", analyzedAt: Date.now(), name: SAMPLES[k].name, fileName: SAMPLES[k].fileName, fileSize: SAMPLES[k].fileSize, fileKind: "PDF", demo: true, prototype: false, preview: null, asked: [] });
    let a = docs.find((d) => d.sampleKey === "lease" && d.demo), b = docs.find((d) => d.sampleKey === "lease2");
    const add = [];
    if (!a) { a = mk("lease"); add.push(a); }
    if (!b) { b = mk("lease2"); b.analyzedAt = Date.now() + 1; add.push(b); }
    if (add.length) setDocs((d) => [...add, ...d]);
    setRoute({ view: "compare", ids: [a.id, b.id] });
  };
  const updateDoc = (id, patch) => setDocs((ds) => ds.map((d) => (d.id === id ? { ...d, ...patch } : d)));
  const requestDelete = (doc) => setConfirm({
    title: "Delete this document?", body: `"${doc.name}" and its analysis will be removed from this browser. This can't be undone.`, label: "Delete",
    run: () => { setDocs((ds) => ds.filter((d) => d.id !== doc.id)); if (route.view === "report") setRoute({ view: "history" }); notify("Document deleted"); },
  });
  const requestDeleteAll = () => setConfirm({
    title: `Delete all ${docs.length} documents?`, body: "Every saved analysis will be removed from this browser. This can't be undone.", label: "Delete all",
    run: () => { setDocs([]); notify("All documents deleted"); },
  });

  const current = route.view === "report" ? docs.find((d) => d.id === route.id) : null;
  const navCurrent = ["history", "report", "compare"].includes(route.view) ? "history" : route.view === "upload" || route.view === "analyzing" ? "upload" : route.view === "glossary" ? "glossary" : route.view === "lab" ? "lab" : "home";

  return (
    <>
      <header className="topbar">
        <div className="wrap">
          <button className="brand" onClick={() => go("home")} aria-label="MoneyReceipt home">
            <span className="brand-mark"><Icon name="receipt" size={18} stroke={2.2} /></span>
            <span className="brand-text">Money<b>Receipt</b></span>
          </button>
          <nav className="nav" aria-label="Main">
            <button className="nav-btn" aria-label="Home" aria-current={navCurrent === "home" ? "page" : undefined} onClick={() => go("home")}><Icon name="home" size={17} /><span className="lbl-long">Home</span></button>
            <button className="nav-btn" aria-label="Analyze" aria-current={navCurrent === "upload" ? "page" : undefined} onClick={() => go("upload")}><Icon name="upload" size={17} /><span className="lbl-mid">Analyze</span></button>
            <button className="nav-btn" aria-label={`History, ${docs.length} documents`} aria-current={navCurrent === "history" ? "page" : undefined} onClick={() => go("history")}><Icon name="history" size={17} /><span className="lbl-mid">History</span> <span className="count">{docs.length}</span></button>
            <button className="nav-btn" aria-label="Accuracy Lab" aria-current={navCurrent === "lab" ? "page" : undefined} onClick={() => go("lab")}><Icon name="flask" size={17} /><span className="lbl-mid">Lab</span></button>
            <button className="nav-btn" aria-label="Learn the terms" aria-current={navCurrent === "glossary" ? "page" : undefined} onClick={() => go("glossary")}><Icon name="book" size={17} /><span className="lbl-mid">Learn</span></button>
            <button className="theme-btn" onClick={() => setTheme(isDark ? "light" : "dark")} aria-label={isDark ? "Switch to light theme" : "Switch to dark theme"} title={isDark ? "Light theme" : "Dark theme"}><Icon name={isDark ? "sun" : "moon"} size={17} /></button>
          </nav>
        </div>
      </header>

      <main className="wrap" ref={mainRef} tabIndex={-1} id="main">
        {route.view === "home" && <Landing go={go} startDemo={startDemo} onVersionDemo={openVersionDemo} />}
        {route.view === "upload" && <UploadView onAnalyze={analyzeUpload} startDemo={startDemo} />}
        {route.view === "analyzing" && pending && <AnalyzingView pending={pending} onDone={finish} onCancel={() => { setPending(null); go("upload"); notify("Analysis cancelled"); }} />}
        {route.view === "analyzing" && !pending && <EmptyState icon="alert" title="Nothing to analyze" actions={<button className="btn btn-primary" onClick={() => go("upload")}>Upload a document</button>}>Choose a document to start.</EmptyState>}
        {route.view === "report" && current && <Report key={current.id} doc={current} go={go} requestDelete={requestDelete} updateDoc={updateDoc} notify={notify} />}
        {route.view === "report" && !current && <EmptyState icon="file" title="This document isn't available" actions={<button className="btn btn-primary" onClick={() => go("history")}>Go to History</button>}>It may have been deleted, or your browser's saved data was cleared.</EmptyState>}
        {route.view === "history" && <HistoryView docs={docs} open={open} go={go} startDemo={startDemo} requestDelete={requestDelete} requestDeleteAll={requestDeleteAll} storageOk={storageOk} onCompare={(ids) => setRoute({ view: "compare", ids })} onVersionDemo={openVersionDemo} />}
        {route.view === "compare" && <CompareView docs={docs} ids={route.ids || []} open={open} go={go} swap={() => setRoute({ view: "compare", ids: [...(route.ids || [])].reverse() })} />}
        {route.view === "lab" && <AccuracyLab />}
        {route.view === "glossary" && <GlossaryView go={go} />}
      </main>

      <footer>
        <div className="wrap">
          <Disclaimer />
          <span>MoneyReceipt prototype · Saved documents stay in this browser.</span>
        </div>
      </footer>

      {confirm && <ConfirmDialog title={confirm.title} body={confirm.body} confirmLabel={confirm.label} onCancel={() => setConfirm(null)} onConfirm={() => { confirm.run(); setConfirm(null); }} />}
      {toast && <div className="toast" role="status"><Icon name="check" size={16} />{toast}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</html>
