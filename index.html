<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoneyReceipt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column (max 1120px) under a sticky top bar; reports use a summary row, tabs, then a two-column body that stacks on phones. */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #eef2f8;
  --line: #dce3ee;
  --fg: #0d1b3e;
  --muted: #56627a;
  --accent: #1d5bd8;
  --accent-ink: #ffffff;
  --accent-soft: #e7eefc;
  --brand-green: #0f8a5f;
  --green: #11774a; --green-bg: #e4f4eb;
  --yellow: #8a5800; --yellow-bg: #fcf1d4;
  --red: #b42318; --red-bg: #fdebea;
  --blue: #1d5bd8; --blue-bg: #e8effc;
  --gray: #5f6b82; --gray-bg: #eef1f6;
  --paper: #fffefb;
  --printer: #0d1b3e;
  --glow-1: rgba(29, 91, 216, .10);
  --glow-2: rgba(15, 138, 95, .08);
  --shadow: 0 1px 2px rgba(13,27,62,.05), 0 6px 20px rgba(13,27,62,.06);
  --shadow-lg: 0 10px 40px rgba(13,27,62,.16);
  --font-display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  --r-sm: 9px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1020; --surface: #111a2e; --surface-2: #18233a; --line: #26334d;
    --fg: #e7ecf6; --muted: #9ba8c1; --accent: #6f9dff; --accent-ink: #0a1020; --accent-soft: #19284a;
    --brand-green: #3fcf8e; --glow-1: rgba(111, 157, 255, .10); --glow-2: rgba(63, 207, 142, .06); --printer: #2b3a5c;
    --green: #56d394; --green-bg: #0f2a1f; --yellow: #f1c35a; --yellow-bg: #2c2410;
    --red: #ff8b80; --red-bg: #351818; --blue: #85abff; --blue-bg: #15223f;
    --gray: #a3aec4; --gray-bg: #1a2338; --paper: #151f35;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    --shadow-lg: 0 10px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1020; --surface: #111a2e; --surface-2: #18233a; --line: #26334d;
  --fg: #e7ecf6; --muted: #9ba8c1; --accent: #6f9dff; --accent-ink: #0a1020; --accent-soft: #19284a;
  --brand-green: #3fcf8e; --glow-1: rgba(111, 157, 255, .10); --glow-2: rgba(63, 207, 142, .06); --printer: #2b3a5c;
  --green: #56d394; --green-bg: #0f2a1f; --yellow: #f1c35a; --yellow-bg: #2c2410;
  --red: #ff8b80; --red-bg: #351818; --blue: #85abff; --blue-bg: #15223f;
  --gray: #a3aec4; --gray-bg: #1a2338; --paper: #151f35;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  --shadow-lg: 0 10px 40px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: radial-gradient(1100px 520px at 88% -8%, var(--glow-1), transparent 62%), radial-gradient(900px 460px at -12% 4%, var(--glow-2), transparent 60%), var(--bg); background-attachment: fixed; color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 4px; cursor: pointer; font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: -0.02em; color: var(--fg); }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.brand span b { color: var(--brand-green); font-weight: 800; }
.nav { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.nav-btn { background: none; border: 0; padding: 8px 12px; border-radius: 9px; cursor: pointer; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }
.nav-btn:hover { background: var(--surface-2); color: var(--fg); }
.nav-btn[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.count { font-size: 11px; background: var(--surface-2); color: var(--muted); border-radius: 99px; padding: 1px 7px; font-weight: 700; }
.nav-btn[aria-current="page"] .count { background: var(--accent); color: var(--accent-ink); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 10px 16px; font-weight: 600; border: 1px solid transparent; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; text-decoration: none; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--fg)); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-ghost { background: var(--surface); border-color: var(--line); color: var(--fg); }
.btn-ghost:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: var(--surface-2); }
.btn-danger { background: var(--red); color: var(--surface); }
.btn-danger:hover { background: color-mix(in srgb, var(--red) 85%, var(--fg)); }
.btn-danger-ghost { background: var(--surface); border-color: var(--line); color: var(--red); }
.btn-danger-ghost:hover { background: var(--red-bg); border-color: color-mix(in srgb, var(--red) 40%, var(--line)); }
.btn-sm { padding: 7px 11px; font-size: 14px; border-radius: 9px; }
.btn-lg { padding: 13px 22px; font-size: 16px; border-radius: 12px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.link-btn:hover { text-decoration: underline; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-pad { padding: 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card-head h2, .card-head h3 { font-size: 17px; }
.card-sub { color: var(--muted); font-size: 13.5px; }

/* Tone */
.t-green { --tc: var(--green); --tb: var(--green-bg); }
.t-yellow { --tc: var(--yellow); --tb: var(--yellow-bg); }
.t-red { --tc: var(--red); --tb: var(--red-bg); }
.t-blue { --tc: var(--blue); --tb: var(--blue-bg); }
.t-gray { --tc: var(--gray); --tb: var(--gray-bg); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; color: var(--tc); background: var(--tb); white-space: nowrap; letter-spacing: .01em; }
.pill-lg { font-size: 13.5px; padding: 5px 12px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tc); flex: none; display: inline-block; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-weight: 600; white-space: nowrap; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; border: 1px dashed var(--muted); color: var(--muted); white-space: nowrap; }

main { padding-block: 28px 56px; min-height: 60vh; }
main:focus { outline: none; }

/* Landing */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 48px; align-items: center; padding-block: 28px 40px; }
.hero h1 { font-size: clamp(34px, 5vw, 54px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.04; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero-lede { font-size: 18px; color: var(--muted); margin-top: 18px; max-width: 34em; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
.hero-note { margin-top: 14px; font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.receipt-wrap { filter: drop-shadow(0 12px 28px rgba(13,27,62,.14)); max-width: 380px; width: 100%; justify-self: center; }
.receipt { background: var(--paper); border-radius: 12px 12px 0 0; padding: 22px 22px 12px; font-family: var(--font-mono); font-size: 13px; position: relative; }
.receipt-zig { height: 14px; background: linear-gradient(135deg, var(--paper) 50%, transparent 50%) 0 0 / 14px 14px repeat-x, linear-gradient(-135deg, var(--paper) 50%, transparent 50%) 0 0 / 14px 14px repeat-x; }
.receipt-title { text-align: center; font-weight: 600; letter-spacing: .12em; font-size: 12px; color: var(--muted); }
.receipt-doc { text-align: center; font-family: var(--font-display); font-size: 16px; font-weight: 700; margin: 4px 0 12px; }
.rline { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
.rline .lbl { flex: none; max-width: 70%; }
.rline .lead { flex: 1; border-bottom: 1.5px dotted var(--line); transform: translateY(-4px); min-width: 12px; }
.rline .amt { font-variant-numeric: tabular-nums; }
.rline.red { color: var(--red); }
.rline.muted { color: var(--muted); }
.rsep { border-top: 1.5px dashed var(--line); margin: 10px 0; }
.rtotal { display: flex; justify-content: space-between; font-weight: 600; font-size: 15px; }
.rtotal .amt { font-size: 18px; }
.rstamp { margin-top: 12px; text-align: center; font-size: 11.5px; color: var(--red); border: 1.5px solid var(--red); border-radius: 6px; padding: 6px; transform: rotate(-1.5deg); }

.section { padding-block: 40px; }
.section-head { max-width: 640px; margin-bottom: 24px; }
.section-head h2 { font-size: 28px; font-weight: 800; letter-spacing: -0.025em; }
.section-head p { color: var(--muted); margin-top: 8px; font-size: 16px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.step { padding: 22px; }
.step-n { font-family: var(--font-mono); font-size: 13px; color: var(--accent); font-weight: 600; }
.step h3 { font-size: 18px; margin: 8px 0 6px; }
.step p { color: var(--muted); font-size: 14.5px; }
.doc-types { display: flex; flex-wrap: wrap; gap: 10px; }
.doc-type-chip { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 14.5px; }
.legend-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.legend-item { padding: 16px; border-radius: 12px; background: var(--tb); color: var(--fg); }
.legend-item strong { color: var(--tc); display: flex; align-items: center; gap: 7px; font-family: var(--font-display); font-size: 16px; }
.legend-item p { font-size: 13.5px; margin-top: 4px; color: var(--muted); }
.trust { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.trust .card { padding: 20px; }
.trust h3 { font-size: 16px; display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.trust p { font-size: 14px; color: var(--muted); }
.cta-band { background: var(--fg); color: var(--bg); border-radius: 18px; padding: 32px; display: flex; gap: 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.cta-band h2 { font-size: 24px; }
.cta-band p { opacity: .8; margin-top: 4px; }
.cta-band .btn-ghost { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }

/* Upload */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.025em; }
.page-head p { color: var(--muted); margin-top: 6px; }
.upload-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 20px; align-items: start; }
.dropzone { border: 2px dashed color-mix(in srgb, var(--accent) 35%, var(--line)); border-radius: var(--r); background: var(--surface); padding: 40px 24px; text-align: center; cursor: pointer; transition: background .15s, border-color .15s; display: block; }
.dropzone:hover, .dropzone.drag { background: var(--accent-soft); border-color: var(--accent); }
.dropzone:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.dz-icon { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 14px; }
.dropzone.drag .dz-icon { background: var(--accent); color: var(--accent-ink); }
.dz-title { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.dz-sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.formats { display: flex; gap: 6px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.file-card { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.file-ico { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--font-mono); font-size: 11px; font-weight: 600; flex: none; overflow: hidden; }
.file-ico img { width: 100%; height: 100%; object-fit: cover; }
.file-meta { min-width: 0; flex: 1; }
.file-name { font-weight: 600; overflow-wrap: anywhere; }
.file-sub { font-size: 13px; color: var(--muted); }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 11px; background: var(--tb); color: var(--fg); font-size: 14px; }
.alert > svg { color: var(--tc); flex: none; margin-top: 2px; }
.alert strong { color: var(--tc); }
.type-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.type-opt { position: relative; }
.type-opt input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
.type-opt label { display: flex; align-items: center; gap: 9px; padding: 11px 12px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; transition: border-color .15s, background .15s; height: 100%; }
.type-opt label svg { color: var(--muted); flex: none; }
.type-opt input:checked + label { border-color: var(--accent); background: var(--accent-soft); }
.type-opt input:checked + label svg { color: var(--accent); }
.type-opt input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.type-opt.full { grid-column: 1 / -1; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.samples { display: grid; gap: 8px; }
.sample-btn { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; width: 100%; }
.sample-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.sample-btn .s-ico { width: 36px; height: 36px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; color: var(--accent); flex: none; }
.sample-btn strong { display: block; font-size: 14.5px; }
.sample-btn span { font-size: 13px; color: var(--muted); }
.sample-btn .arrow { margin-left: auto; color: var(--muted); flex: none; }

/* Analyzing */
.analyzing { max-width: 560px; margin: 24px auto; padding: 32px; text-align: center; }
.scan { width: 120px; height: 150px; margin: 0 auto 22px; position: relative; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; box-shadow: var(--shadow); }
.scan i { position: absolute; left: 14px; height: 6px; border-radius: 3px; background: var(--surface-2); }
.scan .beam { position: absolute; left: 0; right: 0; height: 34px; background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--accent) 30%, transparent), transparent); animation: beam 1.6s ease-in-out infinite; }
@keyframes beam { 0% { top: -34px; } 100% { top: 150px; } }
.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 18px 0 22px; }
.progress > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--brand-green)); border-radius: 99px; transition: width .5s ease; }
.a-steps { list-style: none; padding: 0; margin: 0 0 24px; text-align: left; display: grid; gap: 10px; }
.a-steps li { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 14.5px; }
.a-steps li.done { color: var(--fg); }
.a-steps li.active { color: var(--fg); font-weight: 600; }
.a-ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 2px solid var(--line); }
.a-steps li.done .a-ico { background: var(--green); border-color: var(--green); color: var(--surface); }
.a-steps li.active .a-ico { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Report */
.report-head { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.report-head h1 { font-size: clamp(24px, 3.4vw, 32px); font-weight: 800; letter-spacing: -0.025em; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.back { margin-bottom: 14px; }
.banner { margin-top: 16px; }
.plain-summary { margin-top: 18px; padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start; }
.plain-summary .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.plain-summary p { font-size: 15.5px; max-width: 75ch; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.kpi-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kpi-label { font-size: 13px; color: var(--muted); font-weight: 600; }
.kpi-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--tb); color: var(--tc); flex: none; }
.kpi-value { font-family: var(--font-display); font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; overflow-wrap: anywhere; }
.kpi-value.small { font-size: 17px; line-height: 1.3; font-weight: 700; }
.kpi-sub { font-size: 13px; color: var(--muted); }
.kpi-foot { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: auto; padding-top: 4px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-top: 26px; overflow-x: auto; scrollbar-width: thin; }
.tab { background: none; border: 0; padding: 11px 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; border-radius: 8px 8px 0 0; }
.tab:hover { color: var(--fg); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab .count { font-size: 11px; }
.tabpanel { padding-top: 22px; }
.tabpanel:focus { outline: none; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 18px; align-items: start; }

/* Cost breakdown */
.stackbar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; gap: 2px; background: var(--surface-2); margin-bottom: 14px; }
.stackbar > span { background: var(--tc); min-width: 3px; }
.cost-rows { display: grid; gap: 2px; }
.cost-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.cost-row:last-child { border-bottom: 0; }
.cost-row .c-label { font-weight: 600; font-size: 14.5px; min-width: 0; }
.cost-row .c-amt { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.cost-row .c-sub { grid-column: 2 / 4; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.cost-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; margin-top: 4px; border-top: 2px solid var(--fg); font-weight: 700; gap: 10px; }
.cost-total .num { font-size: 19px; }
.extras { margin-top: 14px; padding: 12px 14px; border-radius: 11px; background: var(--surface-2); font-size: 13.5px; display: grid; gap: 8px; }

/* Fee list */
.fee-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.fee { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--tb); }
.fee .f-ico { color: var(--tc); display: grid; }
.fee .f-label { font-weight: 600; font-size: 14px; min-width: 0; }
.fee .f-amt { font-family: var(--font-mono); font-weight: 600; font-size: 14px; color: var(--tc); text-align: right; }
.fee .f-sub { grid-column: 2 / 4; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Field rows */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.fchip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-weight: 600; font-size: 13.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--fg); }
.fchip:hover { border-color: var(--accent); }
.fchip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.fchip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px var(--bg); }
.group + .group { margin-top: 22px; }
.group > h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 10px; font-family: var(--font-body); font-weight: 700; }
.field { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 6px 20px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.field:last-child { border-bottom: 0; }
.field-label { font-weight: 700; font-size: 14px; display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; }
.field-value { font-size: 15px; font-weight: 500; }
.field-note { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
.field-foot { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; margin-top: 8px; font-size: 12.5px; }
.missing { color: var(--muted); font-style: italic; }
details.notfound { margin-top: 18px; }
details.notfound summary { cursor: pointer; font-weight: 600; padding: 12px 16px; list-style: none; display: flex; align-items: center; gap: 8px; }
details.notfound summary::-webkit-details-marker { display: none; }
details.notfound summary .chev { transition: transform .15s; }
details.notfound[open] summary .chev { transform: rotate(90deg); }
.nf-row { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 4px 20px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 14px; }
.nf-row b { font-weight: 600; }

/* Confidence */
.conf { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.bars i { width: 4px; border-radius: 1px; background: var(--line); display: block; }
.bars i:nth-child(1) { height: 5px; } .bars i:nth-child(2) { height: 8px; } .bars i:nth-child(3) { height: 12px; }
.conf.high .bars i { background: var(--green); }
.conf.med .bars i:nth-child(-n+2) { background: var(--yellow); }
.conf.low .bars i:nth-child(1) { background: var(--red); }

/* Source link */
.src { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); font-size: 12.5px; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.src:hover { text-decoration: underline; }

/* Term help */
.help-btn { width: 19px; height: 19px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: 11.5px; font-weight: 700; cursor: pointer; display: inline-grid; place-items: center; padding: 0; flex: none; }
.help-btn:hover, .help-btn[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.term-pop { margin-top: 8px; padding: 10px 12px; background: var(--accent-soft); border-radius: 9px; font-size: 13.5px; color: var(--fg); font-weight: 400; flex-basis: 100%; }
.term-pop b { color: var(--accent); }

/* Timeline */
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.tl-item { display: grid; grid-template-columns: 62px 22px minmax(0, 1fr); gap: 0 12px; position: relative; padding-bottom: 18px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before { content: ""; position: absolute; left: 84px; top: 22px; bottom: -2px; width: 2px; background: var(--line); }
.tl-item:last-child::before { display: none; }
.tl-date { text-align: right; line-height: 1.15; padding-top: 2px; }
.tl-date .m { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tl-date .d { font-family: var(--font-display); font-size: 22px; font-weight: 800; }
.tl-date .y { font-size: 11.5px; color: var(--muted); }
.tl-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--tb); border: 2px solid var(--tc); display: grid; place-items: center; margin-top: 4px; position: relative; z-index: 1; color: var(--tc); }
.tl-body { min-width: 0; padding: 2px 0; }
.tl-body h4 { font-size: 15.5px; font-family: var(--font-body); font-weight: 700; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tl-body p { font-size: 14px; color: var(--muted); margin-top: 3px; }
.tl-item.past { opacity: .55; }
.tl-foot { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; margin-top: 6px; font-size: 12.5px; }

/* Risks */
.risk-list { display: grid; gap: 10px; }
.risk { padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; }
.risk-ico { width: 34px; height: 34px; border-radius: 10px; background: var(--tb); color: var(--tc); display: grid; place-items: center; }
.risk h4 { font-size: 15.5px; font-family: var(--font-body); font-weight: 700; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.risk p { font-size: 14px; color: var(--muted); margin-top: 4px; }
.risk-mini { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.risk-mini:last-child { border-bottom: 0; }
.risk-mini .dot { margin-top: 7px; }
.risk-mini b { font-size: 14.5px; }
.risk-mini p { font-size: 13.5px; color: var(--muted); }

/* Questions */
.q-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.q { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); align-items: start; }
.q input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--green); cursor: pointer; }
.q label { font-weight: 600; cursor: pointer; font-size: 15px; }
.q.asked label { text-decoration: line-through; color: var(--muted); }
.q p { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
.q-foot { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; margin-top: 6px; font-size: 12.5px; }
.q-mini { padding: 9px 0; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 14.5px; display: flex; gap: 10px; }
.q-mini:last-child { border-bottom: 0; }
.q-mini svg { color: var(--accent); flex: none; margin-top: 3px; }

/* Document preview */
.doc-layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 18px; align-items: start; }
.paper { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 28px 30px; box-shadow: var(--shadow); font-family: Georgia, "Times New Roman", serif; font-size: 14.5px; line-height: 1.6; color: var(--fg); }
.paper + .paper { margin-top: 14px; }
.paper-head { display: flex; justify-content: space-between; font-family: var(--font-body); font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px; gap: 10px; }
.paper h3 { font-family: Georgia, serif; font-size: 18px; text-align: center; margin-bottom: 14px; letter-spacing: 0; }
.blk { padding: 8px 10px; margin: 0 -10px; border-radius: 6px; scroll-margin-top: 90px; transition: background .3s, box-shadow .3s; position: relative; }
.blk.marked { box-shadow: inset 3px 0 0 var(--tc); background: color-mix(in srgb, var(--tb) 55%, transparent); }
.blk.hl { background: var(--tb); box-shadow: inset 3px 0 0 var(--tc), 0 0 0 2px var(--tc); }
.blk h4 { font-family: Georgia, serif; font-size: 14.5px; font-weight: 700; margin-bottom: 2px; letter-spacing: 0; }
.blk-tag { float: right; margin-left: 8px; font-family: var(--font-body); }
.doc-side { position: sticky; top: 80px; }
.doc-side ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.doc-side li button { width: 100%; text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 8px; cursor: pointer; display: flex; gap: 8px; align-items: center; font-size: 13.5px; }
.doc-side li button:hover { background: var(--surface-2); }
.thumb { display: grid; grid-template-columns: 84px minmax(0,1fr); gap: 14px; align-items: center; }
.thumb-page { height: 108px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); padding: 10px 9px; display: grid; gap: 5px; align-content: start; box-shadow: var(--shadow); overflow: hidden; }
.thumb-page i { height: 4px; border-radius: 2px; background: var(--surface-2); display: block; }
.thumb-page i.m { background: var(--tc); opacity: .55; }
.thumb-page img { width: 100%; height: 100%; object-fit: cover; }
.upload-preview { margin-bottom: 16px; }
.upload-preview img { max-height: 420px; width: auto; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }

/* Summary sheet */
.sheet-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
.sheet { background: var(--paper); border-radius: 12px 12px 0 0; padding: 28px; font-size: 14px; }
.sheet h2 { font-size: 22px; }
.sheet h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 8px; font-family: var(--font-body); }
.sheet .rline { font-family: var(--font-mono); font-size: 13px; }
.sheet ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.kt { display: grid; grid-template-columns: minmax(0, 13em) minmax(0, 1fr); gap: 2px 14px; padding: 4px 0; font-size: 13px; }
.kt .k { font-family: var(--font-mono); }
.kt .v.nf { color: var(--muted); font-style: italic; }
.sheet-side .btn { white-space: normal; text-align: center; }
.evidence { flex-basis: 100%; display: grid; gap: 8px; margin-top: 4px; }
.evidence blockquote { margin: 0; padding: 10px 12px; border-radius: 9px; background: var(--surface-2); font-family: Georgia, "Times New Roman", serif; font-size: 13.5px; line-height: 1.5; color: var(--fg); }
.ev-grid { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.ev-grid b { color: var(--fg); }
.evidence blockquote.conflict { background: var(--yellow-bg); }
.ev-src { display: block; font-family: var(--font-body); font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.tag-warn { border-color: var(--yellow); color: var(--yellow); border-style: solid; }
.tag-ex { border-color: var(--yellow); color: var(--yellow); background: var(--yellow-bg); border-style: solid; }
.risk-ask { display: flex; gap: 7px; align-items: flex-start; margin-top: 8px; font-size: 13.5px; font-weight: 600; color: var(--fg) !important; }
.risk-ask svg { color: var(--accent); flex: none; margin-top: 2px; }
.proto-banner { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 61px); z-index: 15; box-shadow: var(--shadow); border: 1px solid color-mix(in srgb, var(--yellow) 45%, transparent); }
.next-steps { margin-top: 14px; padding: 18px 20px; }
.next-steps ol { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: ns; }
.next-steps li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 15px; counter-increment: ns; }
.next-steps li::before { content: counter(ns); width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.why-pop { margin-top: 10px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-size: 13.5px; max-width: 70ch; }
.why-pop ul { margin: 6px 0 0; padding-left: 18px; }
.q-status { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--tb); color: var(--tc); margin-top: 1px; }
.q-text { font-weight: 600; font-size: 15px; }
.q.resolved .q-text { text-decoration: line-through; color: var(--muted); }
.q .select { padding: 5px 28px 5px 9px; font-size: 13px; border-radius: 8px; }
.coverage { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.sheet-disclaimer { margin-top: 20px; font-size: 12px; color: var(--muted); border-top: 1.5px dashed var(--line); padding-top: 12px; }

/* History */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.search { position: relative; flex: 1 1 240px; min-width: 0; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.input, .select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.search .input { padding-left: 38px; }
.select { width: auto; padding-right: 30px; cursor: pointer; }
.input:focus, .select:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 11px; border-radius: 8px; font-weight: 600; font-size: 13.5px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.hist-list { display: grid; gap: 10px; }
.hist { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; }
.hist-main { min-width: 0; }
.hist-name { font-weight: 700; font-size: 15.5px; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: var(--fg); overflow-wrap: anywhere; }
.hist-name:hover { color: var(--accent); text-decoration: underline; }
.hist-sub { font-size: 13px; color: var(--muted); display: flex; gap: 6px 12px; flex-wrap: wrap; margin-top: 3px; align-items: center; }
.hist-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.empty { text-align: center; padding: 48px 24px; }
.empty .e-ico { width: 64px; height: 64px; border-radius: 18px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 16px; }
.empty h2 { font-size: 21px; }
.empty p { color: var(--muted); margin: 8px auto 20px; max-width: 42ch; }
.empty .row { justify-content: center; }

/* Dialog + toast */
.overlay { position: fixed; inset: 0; background: rgba(8, 14, 30, .5); display: grid; place-items: center; z-index: 50; padding: 16px; animation: fade .15s ease; }
.dialog { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 24px; max-width: 440px; width: 100%; border: 1px solid var(--line); }
.dialog h2 { font-size: 20px; display: flex; gap: 10px; align-items: center; }
.dialog p { color: var(--muted); margin: 10px 0 20px; }
.dialog .row { justify-content: flex-end; }
@keyframes fade { from { opacity: 0; } }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow-lg); z-index: 60; display: flex; gap: 10px; align-items: center; max-width: calc(100% - 32px); animation: rise .2s ease; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }

footer { border-top: 1px solid var(--line); background: var(--surface); }
footer .wrap { padding-block: 22px; display: flex; gap: 12px 24px; flex-wrap: wrap; justify-content: space-between; font-size: 13px; color: var(--muted); }
.disclaimer { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); max-width: 70ch; }
.disclaimer svg { flex: none; margin-top: 2px; }
.report-disclaimer { margin-top: 28px; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); }
.fade-in { animation: fadeUp .35s ease both; }
@keyframes fadeUp { from { transform: translateY(6px); } }


/* ---- v4 additions */
.hero-art { position: relative; justify-self: center; width: 100%; max-width: 390px; }
.printer { height: 18px; border-radius: 10px; background: var(--printer); position: relative; z-index: 2; margin: 0 -10px -7px; box-shadow: 0 8px 18px rgba(13,27,62,.22); }
.printer::after { content: ""; position: absolute; left: 16px; right: 16px; top: 8px; height: 3px; border-radius: 2px; background: rgba(0, 0, 0, .45); }
.receipt-print { animation: printOut 1.5s cubic-bezier(.2,.7,.2,1) .15s both; filter: drop-shadow(0 14px 26px rgba(13,27,62,.16)); }
@keyframes printOut { from { clip-path: inset(0 0 100% 0); transform: translateY(-44px); } to { clip-path: inset(0 0 -40px 0); transform: none; } }
.callout { position: absolute; z-index: 3; display: flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 11px; background: var(--surface); box-shadow: var(--shadow-lg); font-size: 12.5px; font-weight: 700; color: var(--tc); border: 1px solid var(--line); animation: pop .45s ease 1.6s both; white-space: nowrap; }
.callout small { display: block; color: var(--muted); font-weight: 500; font-size: 11.5px; }
@keyframes pop { from { transform: scale(.85) translateY(6px); } }
.callout.c1 { left: -96px; top: 150px; }
.callout.c2 { right: -84px; bottom: 96px; }
.callout.c3 { right: -60px; top: 40px; }
.hero-stats { display: flex; gap: 14px 32px; flex-wrap: wrap; margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); }
.hero-stats b { display: block; font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.hero-stats span { font-size: 13px; color: var(--muted); }
.demo-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.demo-card { padding: 18px; display: flex; flex-direction: column; gap: 8px; text-align: left; cursor: pointer; transition: transform .18s, box-shadow .18s, border-color .18s; font: inherit; color: inherit; }
.demo-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.demo-card .d-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.demo-card .d-ico { width: 38px; height: 38px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.demo-card .big { font-family: var(--font-display); font-size: 25px; font-weight: 800; letter-spacing: -0.02em; }
.demo-card .lbl { font-size: 12.5px; color: var(--muted); }
.demo-card .go { margin-top: auto; padding-top: 6px; color: var(--accent); font-weight: 600; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.feature-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.feature { padding: 20px; }
.f-icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--tb); color: var(--tc); margin-bottom: 12px; }
.feature h3 { font-size: 16.5px; margin-bottom: 5px; }
.feature p { font-size: 14px; color: var(--muted); }
.report-hero { background: linear-gradient(135deg, var(--accent-soft) 0%, var(--surface) 62%); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; box-shadow: var(--shadow); }
.head-side { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.gauge { text-align: center; }
.gauge svg { display: block; margin: 0 auto; }
.gauge-label { font-weight: 800; font-family: var(--font-display); font-size: 14px; color: var(--tc); margin-top: -2px; }
.donut-row { display: flex; gap: 18px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.donut { flex: none; }
.donut text { fill: var(--fg); font-family: var(--font-display); }
.donut .sub { fill: var(--muted); font-family: var(--font-body); }

async function offerFile(filename, content) {
  const c = window.claude;
  if (c && typeof c.use === "function") {
    const dl = await c.use("downloads");
    if (!dl) throw { code: "unavailable" };
    return dl.save({ filename, data: content });
  }
  const blob = new Blob([content], { type: filename.endsWith(".html") ? "text/html" : "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return { status: "saved" };
}

}

function ConfirmDialog({ title, body, confirmLabel, onConfirm, onCancel }) {

    const onKey = (e) => {
      if (e.key === "Escape") { e.preventDefault(); onCancel(); }
      if (e.key === "Tab" && ref.current) {
        const els = ref.current.querySelectorAll("button");
        const first = els[0], last = els[els.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }

      }
    };
    document.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("keydown", onKey); prev && prev.focus && prev.focus(); };
  }, []);
  return (
    <div className="overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onCancel(); }}>

/* ---------------------------------------------------------------- Upload */
const ACCEPT = { pdf: "PDF", jpg: "JPG", jpeg: "JPG", png: "PNG", docx: "DOCX" };
const MAX_BYTES = 25 * 1048576;

function UploadView({ onAnalyze, startDemo }) {
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [type, setType] = useState("");
  const [guessed, setGuessed] = useState(false);
  const [error, setError] = useState(null);
  const [typeError, setTypeError] = useState(false);
  const [drag, setDrag] = useState(false);
  const inputRef = useRef(null);
  const dragDepth = useRef(0);

  const accept = (f) => {
    setError(null);
    if (!f) return;
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    if (!ACCEPT[ext]) { setFile(null); setPreview(null); setError({ title: "That file type isn't supported", body: `"${f.name}" isn't a PDF, JPG, PNG, or DOCX file. Save or export it in one of those formats and try again.` }); return; }
    if (f.size === 0) { setFile(null); setPreview(null); setError({ title: "That file is empty", body: `"${f.name}" has no content (0 bytes). Check the file and upload it again.` }); return; }
    if (f.size > MAX_BYTES) { setFile(null); setPreview(null); setError({ title: "That file is too large", body: `"${f.name}" is ${fmtSize(f.size)}. Files must be 25 MB or smaller. Try compressing it or uploading fewer pages.` }); return; }
    setFile({ name: f.name, size: f.size, kind: ACCEPT[ext] });
    setPreview(null);
    if (ext === "jpg" || ext === "jpeg" || ext === "png") {
      const r = new FileReader();
      r.onload = () => setPreview(r.result);
      r.readAsDataURL(f);
    }
    const g = guessType(f.name);
    if (g && !type) { setType(g); setGuessed(true); }
  };
  const onDrop = (e) => {
    e.preventDefault(); dragDepth.current = 0; setDrag(false);
    const files = e.dataTransfer.files;
    if (files.length > 1) { setError({ title: "One document at a time", body: "Drop a single file. You can analyze others after this one." }); return; }
    accept(files[0]);
  };
  const submit = () => {
    if (!file) { setError({ title: "Choose a document first", body: "Drag a file into the box above, or click it to browse." }); return; }
    if (!type) { setTypeError(true); document.getElementById("type-fieldset")?.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    onAnalyze({ fileName: file.name, fileSize: file.size, fileKind: file.kind, type, preview });
  };

  return (
    <div className="fade-in">
      <div className="page-head">
        <div><h1>Analyze a document</h1><p>Upload a file and pick its type. We'll turn it into a plain-language summary.</p></div>
      </div>
      <div className="upload-grid">
        <div className="stack">
          <label className={`dropzone${drag ? " drag" : ""}`}
            onDragEnter={(e) => { e.preventDefault(); dragDepth.current++; setDrag(true); }}
            onDragOver={(e) => e.preventDefault()}
            onDragLeave={() => { dragDepth.current = Math.max(0, dragDepth.current - 1); if (!dragDepth.current) setDrag(false); }}
            onDrop={onDrop}>
            <input id="file-input" ref={inputRef} type="file" className="sr-only" accept=".pdf,.jpg,.jpeg,.png,.docx,application/pdf,image/jpeg,image/png,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
              onChange={(e) => { accept(e.target.files[0]); e.target.value = ""; }} aria-describedby="dz-help" />
            <div className="dz-icon"><Icon name="upload" size={26} /></div>
            <div className="dz-title">{drag ? "Drop to upload" : "Drag and drop your document"}</div>
            <div className="dz-sub" id="dz-help">or <span style={{ color: "var(--accent)", fontWeight: 600 }}>click to browse</span> · up to 25 MB</div>
            <div className="formats">{["PDF", "JPG", "PNG", "DOCX"].map((f) => <span className="chip" key={f}>{f}</span>)}</div>
          </label>

          {error && (
            <div className="alert t-red" role="alert">
              <Icon name="alert" size={18} />
              <div><strong>{error.title}.</strong> {error.body}</div>
            </div>
          )}

          {file && (
            <div className="card file-card">
              <div className="file-ico">{preview ? <img src={preview} alt="" /> : file.kind}</div>
              <div className="file-meta">
                <div className="file-name">{file.name}</div>
                <div className="file-sub">{file.kind} · {fmtSize(file.size)} · Ready to analyze</div>
              </div>
              <button className="btn btn-ghost btn-sm" onClick={() => { setFile(null); setPreview(null); setGuessed(false); }} aria-label={`Remove ${file.name}`}><Icon name="x" size={16} /> Remove</button>
            </div>
          )}

          <fieldset id="type-fieldset" className="card card-pad" style={{ margin: 0 }} aria-describedby={typeError ? "type-err" : undefined}>
            <legend className="sr-only">Document type</legend>
            <div className="card-head" style={{ marginBottom: 12 }}>
              <h2 aria-hidden="true">What kind of document is it?</h2>
              {guessed && type && <span className="chip"><Icon name="sparkle" size={14} /> Guessed from the file name</span>}
            </div>
            <div className="type-grid" role="radiogroup">
              {DOC_TYPES.map((t) => (
                <div className={`type-opt${t.key === "other" ? " full" : ""}`} key={t.key}>
                  <input type="radio" id={`type-${t.key}`} name="doctype" value={t.key} checked={type === t.key}
                    onChange={() => { setType(t.key); setGuessed(false); setTypeError(false); }} />
                  <label htmlFor={`type-${t.key}`}><Icon name={t.icon} size={18} /><span>{t.label}<span style={{ display: "block", fontWeight: 400, fontSize: 12.5, color: "var(--muted)" }}>{t.hint}</span></span></label>
                </div>
              ))}
            </div>
            {typeError && <div className="alert t-red" role="alert" id="type-err" style={{ marginTop: 12 }}><Icon name="alert" size={18} /><div><strong>Pick a document type.</strong> It tells MoneyReceipt which terms to look for.</div></div>}
          </fieldset>

          <div className="row" style={{ justifyContent: "space-between" }}>
            <p className="card-sub" style={{ maxWidth: "46ch" }}>Prototype: we only check the file's type and size. Its contents aren't read, and it never leaves your browser. You'll get clearly labeled example results for the type you choose.</p>
            <button className="btn btn-primary btn-lg" onClick={submit} aria-disabled={!file}>
              Analyze document <Icon name="arrowRight" />
            </button>
          </div>
        </div>

        <aside className="stack">
          <div className="card card-pad">
            <div className="card-head" style={{ marginBottom: 6 }}><h2>No file handy?</h2></div>
            <p className="card-sub" style={{ marginBottom: 14 }}>Analyze a demo document. Results are fully worked examples with sources.</p>
            <div className="samples">
              {SAMPLE_ORDER.map((k) => {
                const s = SAMPLES[k];
                return (
                  <button className="sample-btn" key={k} onClick={() => startDemo(k)}>
                    <span className="s-ico"><Icon name={TYPE_BY_KEY[s.type].icon} size={18} /></span>
                    <span style={{ minWidth: 0 }}><strong>{TYPE_BY_KEY[s.type].label}{k === "lease" ? " (recommended)" : ""}</strong><span>{s.blurb}</span></span>
                    <Icon name="arrowRight" size={16} className="arrow" />
                  </button>
                );
              })}
            </div>
          </div>
          <div className="card card-pad stack-sm">
            <h2 style={{ fontSize: 16 }}>Tips for best results</h2>
            <ul style={{ margin: 0, paddingLeft: 18, color: "var(--muted)", fontSize: 14, display: "grid", gap: 4 }}>
              <li>Upload every page, including fine print and addenda.</li>
              <li>For photos, use good light and keep the page flat.</li>
              <li>Black out account numbers you don't want stored.</li>
            </ul>
          </div>
        </aside>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- Analyzing */
const A_STEPS = ["Reading the document", "Finding amounts, rates and dates", "Checking fees, penalties and renewal terms", "Writing your plain-language summary"];
const P_STEPS = ["Checking the file type and size", "Loading the example document", "Building your example report"];
function AnalyzingView({ pending, onDone, onCancel }) {
  const A_STEPS_USED = pending.prototype ? P_STEPS : A_STEPS;
  const [step, setStep] = useState(0);
  useEffect(() => {
    if (step >= A_STEPS_USED.length) { const t = setTimeout(onDone, 350); return () => clearTimeout(t); }
    const t = setTimeout(() => setStep((s) => s + 1), step === 0 ? 1200 : 950);
    return () => clearTimeout(t);
  }, [step]);
  const pct = Math.min(100, Math.round((step / A_STEPS_USED.length) * 100));
  return (
    <div className="card analyzing fade-in">
      <div className="scan" aria-hidden="true">
        {[18, 30, 42, 54, 66, 78, 90, 102, 114, 126].map((y, i) => <i key={y} style={{ top: y, width: `${[70, 55, 80, 62, 74, 50, 78, 66, 58, 72][i]}%` }}></i>)}
        <div className="beam"></div>
      </div>
      <h1 style={{ fontSize: 22 }}>{pending.prototype ? `Preparing an example report for ${pending.fileName}` : `Analyzing ${pending.fileName}`}</h1>
      <p className="card-sub" style={{ marginTop: 6 }}>{TYPE_BY_KEY[pending.type].label} · {pending.fileKind || "PDF"}{pending.prototype ? " · Prototype: your file isn't read" : " · Demo document"}</p>
      <div className="progress" role="progressbar" aria-valuemin={0} aria-valuemax={100} aria-valuenow={pct} aria-label="Analysis progress"><div style={{ width: `${Math.max(pct, 4)}%` }}></div></div>
      <ol className="a-steps" aria-live="polite">
        {A_STEPS_USED.map((s, i) => (
          <li key={s} className={i < step ? "done" : i === step ? "active" : ""}>
            <span className="a-ico">{i < step && <Icon name="check" size={13} stroke={3} />}</span>
            {s}{i < step && <span className="sr-only"> (done)</span>}
          </li>
        ))}
      </ol>
      <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
      {pending.prototype && <p className="card-sub" style={{ marginTop: 12 }}>If you cancel, the selected file is discarded. It was never uploaded anywhere.</p>}
    </div>
  );
}

function KpiCard({ label, value, sub, tone, icon, tag, c, src, small, example, deadline }) {
  return (
    <div className={`card kpi t-${tone}`}>
      <div className="kpi-top"><span className="kpi-label">{label}</span><span className="kpi-ico"><Icon name={icon} size={16} /></span></div>
      <div className={`kpi-value${small ? " small" : ""}`}>{value}</div>

        {example && <span className="tag tag-ex">Example data</span>}
        {tag && tag !== "From document" && <span className="tag">{tag}</span>}

      </div>

function Donut({ items, total, centerLabel, size = 150 }) {
  const r = 56, c = 2 * Math.PI * r;
  let acc = 0;
  return (
    <svg className="donut" width={size} height={size} viewBox="0 0 150 150" role="img" aria-label={`Donut chart of ${items.length} cost items totaling ${centerLabel}. Itemized list follows.`}>
      <circle cx="75" cy="75" r={r} fill="none" stroke="var(--surface-2)" strokeWidth="18" />
      <g transform="rotate(-90 75 75)">
        {items.map((i) => {
          const len = Math.max((i.amount / total) * c - 2, 1.5);
          const el = <circle key={i.label} className={`t-${i.tone}`} cx="75" cy="75" r={r} fill="none" style={{ stroke: "var(--tc)" }} strokeWidth="18" strokeDasharray={`${len} ${c - len}`} strokeDashoffset={-acc}><title>{`${i.label}: ${money(i.amount)}`}</title></circle>;
          acc += (i.amount / total) * c;
          return el;
        })}
      </g>
      <text x="75" y="72" textAnchor="middle" fontSize="19" fontWeight="800">{centerLabel}</text>
      <text x="75" y="91" textAnchor="middle" fontSize="11" className="sub">total</text>
    </svg>
  );
}

function CostBreakdown({ b }) {
  const total = b.items.reduce((s, i) => s + i.amount, 0);
  const pos = b.items.filter((i) => i.amount > 0);
  const posTotal = pos.reduce((s, i) => s + i.amount, 0);
  return (
    <div className="card card-pad">
      <div className="card-head"><h2>{b.title}</h2><Pill tone="blue">{b.items.length} items</Pill></div>
      <div className="donut-row">
        <Donut items={pos} total={posTotal} centerLabel={money(total)} />
        <div className="donut-facts">
          {(() => {
            const extra = b.items.filter((i) => i.tone === "red" || i.tone === "yellow").reduce((s2, i) => s2 + i.amount, 0);
            const biggest = [...pos].sort((x, y) => y.amount - x.amount)[0];
            return (<>
              <div className="t-blue"><b>{biggest.label.split(" (")[0]}</b><span>Largest item · {Math.round((biggest.amount / posTotal) * 100)}% of the total</span></div>
              {extra > 0 && <div className="t-red"><b>{money(extra)}</b><span>Fees and extras flagged in red or yellow</span></div>}
            </>);
          })()}
        </div>
      </div>
      <div className="cost-rows">
        {b.items.map((i) => (
          <div className={`cost-row t-${i.tone}`} key={i.label}>
            <span className="dot" aria-hidden="true"></span>
            <span className="c-label">{i.label}</span>
            <span className="c-amt">{money(i.amount)}</span>
            <span className="c-sub">
              {i.amount > 0 && <span>{((i.amount / posTotal) * 100).toFixed(i.amount / posTotal < 0.01 ? 1 : 0)}%</span>}
              {i.note && <span style={{ color: "var(--tc)", fontWeight: 600 }}>{i.note}</span>}
              {i.term && <TermHelp term={i.term} />}
              <SourceLink src={i.src} />
            </span>
          </div>
        ))}
      </div>
      <div className="cost-total"><span>{b.totalLabel}</span><span className="num">{money(total)}</span></div>
      {b.extras.length > 0 && (
        <div className="extras">
          <b style={{ fontSize: 12.5, textTransform: "uppercase", letterSpacing: ".06em", color: "var(--muted)" }}>Not included in the total</b>
          {b.extras.map((x) => (
            <div key={x.label} style={{ display: "grid", gap: 2 }}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
                <span style={{ fontWeight: 600 }}>{x.label} {x.est && <span className="tag" style={{ marginLeft: 4 }}>Estimate</span>}</span>
                <span className="num" style={{ fontWeight: 600 }}>{x.amount == null ? NOT_FOUND : (x.est ? "≈ " : "") + money(x.amount) + (x.est && x.label.includes("insurance") ? "/yr" : "")}</span>
              </div>
              <div style={{ color: "var(--muted)", display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>{x.note} <SourceLink src={x.src} /></div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function FeeList({ fees }) {
  if (!fees.length) return <p className="missing">{NOT_FOUND}</p>;
  return (
    <ul className="fee-list">
      {fees.map((f) => (
        <li key={f.label} className={`fee t-${f.tone}`}>
          <span className="f-ico"><Icon name={TONE_ICON[f.tone]} size={16} /></span>
          <span className="f-label">{f.label}</span>
          <span className="f-amt">{f.amount}</span>
          <span className="f-sub">{f.note && <span>{f.note}</span>}{f.term && <TermHelp term={f.term} />}<SourceLink src={f.src} /></span>
        </li>
      ))}
    </ul>
  );
}

function CopyDeadline({ d }) {
  const { notify } = useContext(ReportCtx);
  const copy = async () => {
    const ok = await copyText(`${fmtDate(d.date)}: ${d.label}. ${d.detail}${d.calc ? ` (${d.calc})` : ""} Source: ${srcText(d.src)}.`);
    notify(ok ? "Date copied" : "Couldn't copy. Select the text and copy it manually.");
  };
  return <button type="button" className="src" onClick={copy}><Icon name="copy" size={13} /> Copy</button>;
}
function Timeline({ items }) {
  return (
    <ol className="timeline">
      {items.map((d, i) => {
        const past = daysUntil(d.date) < 0;
        const dt = parseDate(d.date);
        return (
          <li key={d.date + d.label} className={`tl-item t-${d.tone}${past ? " past" : ""}`}>
            <div className="tl-date" aria-hidden="true">
              <div className="m">{dt.toLocaleDateString("en-US", { month: "short" })}</div>
              <div className="d">{dt.getDate()}</div>
              <div className="y">{dt.getFullYear()}</div>
            </div>
            <div className="tl-dot" aria-hidden="true"><Icon name={past ? "check" : TONE_ICON[d.tone]} size={11} stroke={3} /></div>
            <div className="tl-body">
              <h4><span className="sr-only">{fmtDate(d.date)}: </span>{d.label} <span className="chip" style={{ fontSize: 12, padding: "2px 8px" }}>{past ? "Passed" : relDays(d.date)}</span></h4>
              <p>{d.detail}</p>
              <div className="tl-foot">
                <ToneBadge tone={d.tone} />
                <Tag calc={!!d.calc} stated />
                <Confidence deadline calc={!!d.calc} why={d.why} />
                <SourceLink src={d.src} />
                <CopyDeadline d={d} />
                {!past && <a className="src" href={gcalUrl(d)} target="_blank" rel="noopener noreferrer"><Icon name="calPlus" size={13} /> Add to calendar</a>}
                <Evidence src={d.src} rel={reliability({ deadline: true, calc: !!d.calc, why: d.why })} />
              </div>
              {d.calc && <p style={{ fontSize: 12.5, marginTop: 4 }}>{d.calc}</p>}
            </div>
          </li>
        );
      })}
    </ol>
  );
}

function RiskCard({ r, ask }) {

  return (

}

          <h2 style={{ fontSize: 17 }}>What if…?</h2>
          <p className="card-sub">{{ lease: "Leave early, stay longer, or pay late. See what each one costs.", loan: "Pay extra each month or drop the add-ons. See the interest you'd save.", paystub: "Change your 401(k) contribution and see your take-home pay.", job: "Try different bonus payouts and 401(k) choices.", insurance: "Pay in full or monthly, and see your cost on a claim.", bill: "Drop add-ons or cancel, and project your next 12 bills.", other: "See the real monthly cost depending on how long you stay." }[data.type]}</p>
          <span className="go">Try scenarios <Icon name="arrowRight" size={15} /></span>

        <div className="card card-pad">

        </div>
      </div>
      <div className="stack">
        <div className="card card-pad">
          <div className="card-head"><h2>Important dates</h2><button className="link-btn" onClick={() => setTab("deadlines")}>All {data.deadlines.length} dates <Icon name="arrowRight" size={14} /></button></div>
          {!upcoming.length && <p className="card-sub" style={{ marginBottom: 12 }}>All dates in this document have passed.</p>}

        </div>
        <div className="card card-pad">
          <div className="card-head"><h2>Risks and unusual terms</h2><button className="link-btn" onClick={() => setTab("risks")}>All {data.risks.length} <Icon name="arrowRight" size={14} /></button></div>
          {topRisks.map((r) => (

            <div className="stack-sm">
              <p className="card-sub">{data.pages.length} pages · {marks} sections reviewed. Findings are highlighted in the text.</p>

function BreakdownTab({ data }) {
  const [tone, setTone] = useState("all");
  const groups = GROUPS.filter((g) => !g.only || g.only.includes(data.type));
  const keys = groups.flatMap((g) => g.fields);
  const found = keys.filter((k) => data.fields[k]);
  const missing = keys.filter((k) => !data.fields[k]);
  const counts = { all: found.length };
  found.forEach((k) => { const t = data.fields[k].tone; counts[t] = (counts[t] || 0) + 1; });
  const filters = [["all", "All"], ["red", "Risks & costs"], ["yellow", "Needs attention"], ["green", "Favorable"], ["blue", "Info"]];
  return (
    <div>
      <div className="filters" role="group" aria-label="Filter results by color">
        {filters.map(([k, l]) => (
          <button key={k} className={`fchip t-${k === "all" ? "gray" : k}`} aria-pressed={tone === k} onClick={() => setTone(k)} disabled={k !== "all" && !counts[k]} style={k !== "all" && !counts[k] ? { opacity: .45, cursor: "not-allowed" } : null}>
            {k !== "all" && <span className="dot"></span>}{l} <span className="count">{counts[k] || 0}</span>
          </button>
        ))}
      </div>
      {groups.map((g) => {
        const rows = g.fields.filter((k) => data.fields[k] && (tone === "all" || data.fields[k].tone === tone));
        if (!rows.length) return null;
        return (
          <div className="group" key={g.key}>
            <h3>{g.title}</h3>
            <div className="card">{rows.map((k) => <FieldRow key={k} k={k} f={data.fields[k]} docType={data.type} />)}</div>
          </div>
        );
      })}
      {missing.length > 0 && (
        <details className="card notfound">
          <summary><Icon name="chev" size={16} className="chev" /> Checked but not found <span className="count">{missing.length}</span></summary>
          <p className="card-sub" style={{ padding: "0 16px 10px" }}>We looked for these terms and didn't locate them. That doesn't prove they don't apply, so ask if any of them matter to you.</p>
          {missing.map((k) => (
            <div className="nf-row" key={k}>
              <b>{FIELD_LABELS[k]}</b>
              <span><span className="missing">{NOT_FOUND}</span>{data.missingHints?.[k] && <span className="card-sub"> {data.missingHints[k]}</span>}</span>
            </div>
          ))}
        </details>
      )}
      <div className="card card-pad" style={{ marginTop: 18 }}>
        <h3 style={{ fontSize: 15, marginBottom: 8 }}>How to read reliability</h3>
        <div className="row" style={{ gap: "8px 18px", fontSize: 13.5, color: "var(--muted)" }}>
          <Confidence value={95} /> <span>The quoted text clearly supports the conclusion (including simple math on stated amounts)</span>
          <Confidence value={80} /> <span>The quote is exact, but the conclusion needs interpretation or a counting rule</span>
          <Confidence est /> <span>Estimate, assumption or conflicting text</span>
        </div>
        <p className="card-sub" style={{ marginTop: 10 }}><b>Source quality</b> is shown separately under "Show evidence": whether the exact passage was found. An exact quote doesn't guarantee our reading of it is right, so reliability rates the conclusion, not the quote.</p>
        <p className="card-sub" style={{ marginTop: 10 }}><span className="tag">Calculated</span> means we did math using numbers in the document. <span className="tag">Estimate</span> means an assumption that is not stated in the document.</p>
      </div>
    </div>
  );
}

function DeadlinesTab({ data }) {

  const up = data.deadlines.filter((d) => daysUntil(d.date) >= 0);
  const past = data.deadlines.filter((d) => daysUntil(d.date) < 0);

  return (
    <div className="grid-2">
      <div className="card card-pad">
        <div className="card-head">
          <h2>Important deadlines</h2>

              <button key={k} aria-pressed={filter === k} onClick={() => setFilter(k)}>{l}</button>
            ))}
          </div>
        </div>
        {items.length ? <Timeline items={items} /> : <p className="missing">{filter === "past" ? "No dates have passed yet." : "No upcoming dates. Everything in this document is in the past."}</p>}

        <div className="card card-pad stack-sm">
          <h2 style={{ fontSize: 17 }}>Don't miss these</h2>
          {data.deadlines.filter((d) => d.tone === "red").length ? data.deadlines.filter((d) => d.tone === "red").map((d) => (
            <div key={d.label} className="alert t-red"><Icon name="flag" size={16} /><div><strong>{fmtDate(d.date)}</strong>: {d.label}</div></div>

function RisksTab({ data }) {
  const [sev, setSev] = useState("all");
  const counts = { all: data.risks.length };
  data.risks.forEach((r) => (counts[r.sev] = (counts[r.sev] || 0) + 1));
  const list = data.risks.filter((r) => sev === "all" || r.sev === sev);
  return (
    <div>
      <div className="filters" role="group" aria-label="Filter risks by severity">
        {[["all", "All"], ["high", "High"], ["medium", "Medium"], ["low", "Low"]].map(([k, l]) => (
          <button key={k} className={`fchip t-${k === "all" ? "gray" : SEV[k].tone}`} aria-pressed={sev === k} onClick={() => setSev(k)}>
            {k !== "all" && <span className="dot"></span>}{l} <span className="count">{counts[k] || 0}</span>

const Q_STATUS = { open: { label: "Not asked yet", tone: "gray", icon: "question" }, asked: { label: "Asked, waiting", tone: "yellow", icon: "clock" }, resolved: { label: "Answered", tone: "green", icon: "check" } };
function QuestionsTab({ data, qs, setStatus, notify }) {
  const st = (i) => qs[i] || "open";
  const asked = data.questions.filter((_, i) => st(i) === "asked").length;
  const resolved = data.questions.filter((_, i) => st(i) === "resolved").length;
  const copyAll = async () => {
    const ok = await copyText(data.questions.map((q, i) => `${i + 1}. ${q.q}`).join("\n"));
    notify(ok ? "Questions copied" : "Couldn't copy. Select the questions and copy them manually.");
  };
  const copyOne = async (q) => {
    const ok = await copyText(q.q);
    notify(ok ? "Question copied" : "Couldn't copy. Select the question and copy it manually.");
  };
  return (
    <div className="grid-2">
      <div>
        <div className="card-head">
          <div><h2 style={{ fontSize: 19 }}>Ask your {ASK_WHO[data.type]}</h2><p className="card-sub">{resolved} answered · {asked} waiting for a reply · {data.questions.length - asked - resolved} not asked yet</p></div>
          <button className="btn btn-ghost btn-sm" onClick={copyAll}><Icon name="copy" size={16} /> Copy all</button>
        </div>
        <ul className="q-list">
          {data.questions.map((q, i) => {
            const s = Q_STATUS[st(i)];
            return (
              <li key={q.q} className={`q ${st(i)}`}>
                <span className={`q-status t-${s.tone}`} aria-hidden="true"><Icon name={s.icon} size={14} stroke={2.4} /></span>
                <div style={{ minWidth: 0 }}>
                  <p className="q-text" id={`qt-${i}`}>{q.q}</p>
                  <p>{q.why}</p>
                  <div className="q-foot">
                    <span className="chip" style={{ fontSize: 12, padding: "2px 8px" }}>{q.cat}</span>
                    <SourceLink src={q.src} />
                    <button type="button" className="src" onClick={() => copyOne(q)} aria-label={`Copy question: ${q.q}`}><Icon name="copy" size={13} /> Copy</button>
                    <label htmlFor={`qs-${i}`} className="sr-only">Status</label>
                    <select id={`qs-${i}`} className="select" value={st(i)} onChange={(e) => setStatus(i, e.target.value)} aria-describedby={`qt-${i}`}>
                      {Object.entries(Q_STATUS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                    </select>
                  </div>
                </div>

            );

        </ul>
      </div>
      <div className="card card-pad stack-sm">
        <h2 style={{ fontSize: 17 }}>Tips for asking</h2>
        <ul style={{ margin: 0, paddingLeft: 18, color: "var(--muted)", fontSize: 14, display: "grid", gap: 6 }}>
          <li>Ask in writing (email) so you have a record of the answer.</li>
          <li>Mark a question "Answered" only once you have a clear reply, ideally in writing.</li>
          <li>If they agree to a change, ask for it to be added to the document before you sign.</li>
          <li>It's normal to ask questions. Clear answers are a good sign.</li>
        </ul>
      </div>
    </div>
  );
}

function DocumentTab({ doc, data, highlight }) {
  const marks = useMemo(() => {
    const m = {};
    const rank = { red: 3, yellow: 2, green: 1, blue: 0 };
    const add = (src, tone) => { if (!src) return; const cur = m[src.a]; m[src.a] = { tone: !cur || rank[tone] > rank[cur.tone] ? tone : cur.tone, n: (cur?.n || 0) + 1 }; };
    Object.values(data.fields).forEach((f) => f && add(f.src, f.tone));
    data.risks.forEach((r) => add(r.src, SEV[r.sev].tone));
    data.fees.forEach((f) => add(f.src, f.tone));
    return m;
  }, [data]);
  useEffect(() => {
    if (!highlight) return;
    const el = document.getElementById(`blk-${highlight.a}`);
    if (el) { el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" }); el.focus({ preventScroll: true }); }
  }, [highlight]);
  const scrollTo = (id) => { const el = document.getElementById(`blk-${id}`); el && el.scrollIntoView({ behavior: "smooth", block: "center" }); el && el.focus({ preventScroll: true }); };
  const all = data.pages.flatMap((p, i) => p.blocks.map((b) => ({ ...b, page: i + 1 })));
  return (
    <div className="doc-layout">
      <div>
        {doc.prototype && (
          <div className="card card-pad upload-preview">
            <div className="card-head"><h2>Your file</h2><span className="chip">{doc.fileKind} · {fmtSize(doc.fileSize)}</span></div>
            {doc.preview ? <img src={doc.preview} alt={`Preview of ${doc.fileName}`} /> : <p className="card-sub">{doc.fileKind === "PDF" || doc.fileKind === "DOCX" ? `A preview of ${doc.fileKind} files isn't available in this prototype.` : "The image preview wasn't saved because it was too large for browser storage."}</p>}
            <div className="alert t-yellow" style={{ marginTop: 12 }}><Icon name="info" size={16} /><div>The text below is the <strong>example {TYPE_BY_KEY[doc.type].label.toLowerCase()}</strong> these results came from. In the full product, this would show your document's text.</div></div>
          </div>
        )}
        {data.pages.map((p, i) => (
          <div className="paper" key={i}>
            <div className="paper-head"><span>{doc.prototype ? SAMPLES[doc.sampleKey].fileName : doc.fileName}</span><span>Page {i + 1} of {data.pages.length}</span></div>
            {p.title && <h3>{p.title}</h3>}
            {p.blocks.map((b) => {
              const mk = marks[b.id];
              const hl = highlight && highlight.a === b.id;
              return (
                <div key={b.id} id={`blk-${b.id}`} tabIndex={-1} className={`blk${mk ? ` marked t-${mk.tone}` : ""}${hl ? " hl" : ""}`}>
                  {mk && <span className="blk-tag"><Pill tone={mk.tone}>{mk.n} finding{mk.n > 1 ? "s" : ""}</Pill></span>}
                  <h4>{b.h}</h4>
                  <p>{b.t}</p>
                </div>
              );
            })}
          </div>
        ))}
      </div>
      <aside className="card card-pad doc-side">
        <h2 style={{ fontSize: 15, marginBottom: 10 }}>Sections</h2>
        <ul>
          {all.map((b) => (
            <li key={b.id}><button onClick={() => scrollTo(b.id)} className={marks[b.id] ? `t-${marks[b.id].tone}` : "t-gray"}>
              <span className="dot" style={!marks[b.id] ? { background: "var(--line)" } : null}></span>
              <span style={{ minWidth: 0, flex: 1 }}>{b.h}</span>
              <span className="card-sub" style={{ fontSize: 12 }}>p.{b.page}</span>
            </button></li>
          ))}
        </ul>
        <p className="card-sub" style={{ marginTop: 12, fontSize: 12.5 }}>Colored sections contain findings. Use "Page · §" links anywhere in the report to jump here.</p>
      </aside>
    </div>
  );
}

function RiskWhy({ data }) {
  const [open, setOpen] = useState(false);
  const n = { high: 0, medium: 0, low: 0 };
  data.risks.forEach((r) => n[r.sev]++);
  const rl = RISK_LEVEL[data.risk];
  return (
    <div>
      <button type="button" className="link-btn" style={{ fontSize: 13.5, marginTop: 6 }} aria-expanded={open} onClick={() => setOpen((o) => !o)}>
        <Icon name="help" size={14} /> Why "{rl.label}"?
      </button>
      {open && (
        <div className="why-pop">
          This document has <b>{n.high} high</b>, <b>{n.medium} medium</b> and <b>{n.low} low</b> severity findings.
          <ul>
            <li><b>High risk:</b> 2 or more high-severity findings (terms that can cost you money or lock you in).</li>
            <li><b>Moderate risk:</b> 1 high-severity finding, or 2 or more medium ones.</li>
            <li><b>Low risk:</b> everything else.</li>
          </ul>
          <p style={{ marginTop: 6, color: "var(--muted)" }}>The rating is a reading guide, not a judgment of whether you should sign.</p>
        </div>
      )}
    </div>
  );
}


function RiskGauge({ level }) {
  const rl = RISK_LEVEL[level];
  const angle = { low: -60, medium: 0, high: 60 }[level];
  const L = Math.PI * 50;
  const seg = L / 3;
  return (
    <div className={`gauge t-${rl.tone}`} role="img" aria-label={`Risk gauge: ${rl.label}`}>
      <svg width="132" height="76" viewBox="0 0 132 76">
        {[["#2fb26f", 0], ["#f0b429", 1], ["#e5484d", 2]].map(([col, k]) => (
          <path key={k} d="M16 66 A50 50 0 0 1 116 66" fill="none" stroke={col} strokeWidth="12" strokeDasharray={`${seg - 3} ${L}`} strokeDashoffset={-(seg * k)} />
        ))}
        <g transform={`rotate(${angle} 66 66)`}>
          <line x1="66" y1="66" x2="66" y2="26" stroke="var(--fg)" strokeWidth="3.5" strokeLinecap="round" />
        </g>
        <circle cx="66" cy="66" r="7" fill="var(--fg)" />
        <circle cx="66" cy="66" r="3" fill="var(--surface)" />
      </svg>
      <div className="gauge-label">{rl.label}</div>
    </div>
  );
}

}
function Toggle({ id, label, sub, checked, onChange }) {

}
function Tiles({ items }) {

function Bars({ rows, title }) {
  const max = Math.max(...rows.map((r) => Math.abs(r.amount)), 1);

// Annual rate at which 60 payments of $497.22 exactly repay $24,500 (matches the $5,333.20 finance charge).
function impliedRate(P, pay, n) {
  let lo = 0, hi = 0.5;
  for (let k = 0; k < 80; k++) {
    const mid = (lo + hi) / 2, r = mid / 12;
    const pv = pay * (1 - Math.pow(1 + r, -n)) / r;
    if (pv > P) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

const SCEN = {

    defaults: { m: 12, late: 0 },
    calc: ({ m, late }) => {
      const monthly = 1950, oneTime = 650, full = 24050;
      let total, why;
      if (m < 12) { total = m * monthly + oneTime + 3700; why = "Includes the $3,700 early termination fee (§18). Assumes rent stops when you move out; the lease doesn't say whether rent is owed during the 60-day notice period."; }
      else if (m === 12) { total = full; why = "The full 12-month term, with no extra charges."; }
      else { total = full + (m - 12) * (monthly + 200); why = "After Nov 30, 2027 the lease goes month-to-month at $200 more per month (§17), so each extra month costs $2,150."; }
      return { total, avg: total / m, lateFee: leaseLateFee(late), full, why };
    },
    describe: ({ m, late }) => `Stay ${m} months${late ? `, pay ${late} days late once` : ""}`,
    metrics: (r) => [["Total cost", r.total + r.lateFee, "money", "low"], ["Average per month", (r.total + r.lateFee) / (r.total / r.avg), "money", "low"], ["Late fees", r.lateFee, "money", "low"]],

      return { base, sc, principal, payment: 497.22 + extra, saved: base.interest - sc.interest };

  },

      const gross = 2884.62, rate = 0.15;

      const match = (gross * Math.min(p, 5) / 100) * 0.5;
      return { contrib, match, takeHome: 1952.12 - (contrib - 144.23) * (1 - rate), yearly: (contrib + match) * 26 };
